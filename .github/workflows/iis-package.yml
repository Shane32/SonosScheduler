name: Build IIS package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ReactApp/package-lock.json
      - run: dotnet tool restore
      - run: dotnet restore
      - run: dotnet test Tests --no-restore
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet publish AppServer -c Release -o artifacts/iis --no-restore
      - uses: actions/upload-artifact@v6
        with:
          name: SonosScheduler-IIS
          path: artifacts/iis
